name: Build FriendlyAI Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/friendlyai-release.jks

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/friendlyai-release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Rename release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FriendlyAI-v1.2.0.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/FriendlyAI-v1.2.0.aab

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendlyAI-v1.2.0-Signed-APK
          path: android/app/build/outputs/apk/release/FriendlyAI-v1.2.0.apk
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: FriendlyAI-v1.2.0-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/FriendlyAI-v1.2.0.aab
          retention-days: 30
